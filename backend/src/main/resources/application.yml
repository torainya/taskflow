server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: taskflow-backend
  datasource:
    # 默认连接本机 Docker 起的 PostgreSQL；可用环境变量覆盖（见 deploy/docker-compose.yml）
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    # 生产环境务必通过 JWT_SECRET 环境变量覆盖（HS256 要求至少 32 字节）
    secret: ${JWT_SECRET:taskflow-demo-secret-change-me-in-production-0123456789}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed-demo-data: ${SEED_DEMO_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.taskflow: INFO
