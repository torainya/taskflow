# 本地零依赖开发配置：H2 以 PostgreSQL 兼容模式运行，无需安装任何数据库
# 用法：mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  datasource:
    url: jdbc:h2:mem:taskflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.taskflow: DEBUG
