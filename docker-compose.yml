# ============================================================
# TaskFlow 一键启动（生产形态）
#   docker compose up -d --build
# 访问：前端 http://localhost:8081   Swagger http://localhost:8080/swagger-ui.html
# 说明：所有密钥均为开发默认值，线上请通过 .env 覆盖
# ============================================================
services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    container_name: taskflow-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskflow
      DB_USERNAME: ${POSTGRES_USER:-taskflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      JWT_SECRET: ${JWT_SECRET:-taskflow-compose-secret-change-me-0123456789}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # 允许跨域直连后端的来源（浏览器同源经 nginx 访问时也必须包含站点地址；
      # 生产部署请改为你的公网地址，如 http://your-ip:8081，多个用逗号分隔）
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-"http://localhost:8081,http://localhost:5173"}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    container_name: taskflow-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
