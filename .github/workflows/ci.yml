# ============================================================
# TaskFlow CI：推送到 main / 任意 PR 时运行
# 1) backend : mvn test（单元测试 + H2 内存库全链路集成测试）
# 2) frontend: npm run build（生产构建验证）
# 3) images  : docker compose build 校验两份 Dockerfile
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · mvn test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test

  frontend:
    name: Frontend · npm build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend & frontend images
        run: docker compose -f docker-compose.yml build backend frontend
